[package]
name = "rust-crud-actix-mongo-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15"
bcrypt = "0.19"
env_logger = "0.11"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
log = "0.4"
mongodb = "3.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
